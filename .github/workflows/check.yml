name: Verify, publish and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Verify Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    # includes cold Chromium OS setup before the complete package and website checks
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['24.15.0', '24.22.0']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and OS dependencies
        run: pnpm --dir website exec playwright install --with-deps chromium

      - name: Check package and production website
        env:
          JG_HQ_RELEASE_DIRECTORY: ${{ runner.temp }}/hq-release
        run: pnpm check

      - name: Upload the consumer-tested release
        if: matrix.node == '24.15.0' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: npm-release
          path: ${{ runner.temp }}/hq-release/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload verified floor-Node website
        if: matrix.node == '24.15.0' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  publish:
    name: Publish verified npm package
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # npm may take up to the release script's 10 minutes to serve an accepted release
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Download the consumer-tested release
        uses: actions/download-artifact@v8
        with:
          name: npm-release
          path: ${{ runner.temp }}/hq-release

      - name: Publish through the configured npm trusted publisher
        env:
          JG_HQ_RELEASE_DIRECTORY: ${{ runner.temp }}/hq-release
        run: node scripts/release/index.ts

  deploy:
    name: Deploy verified website
    needs: [check, publish]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out verification scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Install verification dependencies
        run: pnpm install --frozen-lockfile

      - name: Require the exact npm release and public destinations
        run: pnpm --dir website verify:public-destinations

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy the verified artifact without rebuilding
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify the live HTTPS website
        run: pnpm --dir website verify:deployment
