name: Verify and publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Verify Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['24.15.0', '24.22.0']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile --filter=.

      - name: Check essential package guarantees
        env:
          JG_HQ_RELEASE_DIRECTORY: ${{ runner.temp }}/hq-release
        run: pnpm check:package

      - name: Upload the consumer-tested release
        if: matrix.node == '24.15.0' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: npm-release
          path: ${{ runner.temp }}/hq-release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified npm package
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # npm may take up to the release script's 10 minutes to serve an accepted release
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile --filter=.

      - name: Download the consumer-tested release
        uses: actions/download-artifact@v8
        with:
          name: npm-release
          path: ${{ runner.temp }}/hq-release

      - name: Publish through the configured npm trusted publisher
        env:
          JG_HQ_RELEASE_DIRECTORY: ${{ runner.temp }}/hq-release
        run: node scripts/release/index.ts
